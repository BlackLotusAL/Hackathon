<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曝光领地 · 本地回放</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f3f0;
  --surface: #fff;
  --ink: #15171a;
  --muted: #5d636b;
  --line: #d5d8d3;
  --accent: #f2c200;
  --blue: #2459e0;
  --red: #d6402f;
  --error: #b4232c;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121416;
    --surface: #1b1e21;
    --ink: #eceeea;
    --muted: #a0a6ad;
    --line: #33383d;
    --blue: #5b8cff;
    --red: #ff6b5a;
    --error: #ff7a7f;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--body); }
h1, h2, p { margin: 0; }
button, select { font: inherit; color: inherit; border: 1px solid var(--ink); border-radius: 0; background: var(--surface); }
button { padding: 7px 14px; font-weight: 650; cursor: pointer; }
button.primary { background: var(--ink); color: var(--bg); }
button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #15171a; }
button:disabled, select:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: clamp(12px, 4vw, 28px); }
.masthead { border-bottom: 3px solid var(--ink); }
.masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding-block: 15px; }
.brand { color: var(--muted); font-size: 13px; font-weight: 700; }
h1 { font-size: clamp(27px, 4vw, 38px); line-height: 1.15; font-weight: 900; }
.openers { display: flex; gap: 8px; flex-wrap: wrap; }
#choose-folder { background: var(--accent); color: #15171a; }
#choose-folder:hover { background: #ffe17b; }
main { padding-block: 20px 32px; }
.file-picker {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 14px;
  padding: 10px 12px; border: 1px solid var(--ink); background: var(--surface);
}
.file-picker label { font-weight: 650; }
#replay-list { width: 100%; min-width: 0; padding: 6px 8px; border-color: var(--line); }
#file-status { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
#file-status:empty { display: none; }
#file-status[data-error] { color: var(--error); }

#match-replay {
  margin-top: 20px;
  --replay-cell: #e6e8e3; --replay-defect: #3b4149; --replay-key: #f2c200;
  --replay-boost: #8546bd;
}
.replay-head {
  display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap;
  gap: 4px 12px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--ink);
}
#replay-title { font-size: 20px; line-height: 1.35; }
#replay-match { overflow-wrap: anywhere; }
.replay-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.replay-board { padding: 10px; border: 1px solid var(--ink); background: var(--surface); }
.replay-board canvas { display: block; width: 100%; aspect-ratio: 1; }
.replay-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
.replay-legend i { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
.replay-info { display: grid; min-width: 0; gap: 12px; }
.replay-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--ink); }
.replay-side { padding: 10px 12px; background: var(--surface); overflow-wrap: anywhere; border-top: 4px solid var(--blue); }
.replay-side + .replay-side { border-left: 1px solid var(--ink); border-top-color: var(--red); }
.replay-side [data-score] { display: block; font-size: 29px; line-height: 1.15; }
.replay-side [data-state], .replay-side [data-command] { font-size: 12px; color: var(--muted); }
.replay-result { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.replay-timeline { width: 100%; margin: 0; accent-color: var(--ink); }
.replay-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.replay-controls button { padding: 5px 9px; }
.replay-controls [aria-pressed="true"] { background: var(--accent); color: #15171a; border-color: var(--accent); }
.replay-detail { padding: 6px 9px; border-left: 3px solid var(--line); background: var(--surface); font-size: 13px; }
#replay-boost { border-color: var(--replay-boost); }
.replay-log { border-top: 1px solid var(--ink); }
.replay-log h3 { margin: 6px 0 2px; font-size: 13px; }
.replay-log ol { margin: 0; padding: 0; list-style: none; max-height: 224px; overflow-y: auto; font-size: 13px; }
.replay-log li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
@media (prefers-color-scheme: dark) {
  #match-replay { --replay-cell: #303437; --replay-defect: #737985; --replay-boost: #c593ff; }
}
@media (max-width: 800px) {
  .replay-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div><p class="brand">曝光领地</p><h1>本地回放</h1></div>
    <div class="openers">
      <button type="button" id="choose-folder">选择回放文件夹</button>
      <button type="button" id="choose-files">打开 JSON</button>
      <input type="file" id="folder-input" webkitdirectory multiple hidden>
      <input type="file" id="files-input" accept=".json,application/json" multiple hidden>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="file-picker">
    <label for="replay-list">回放文件</label>
    <select id="replay-list" disabled><option>正在加载回放…</option></select>
    <p id="file-status" role="status"></p>
  </div>
  <section id="match-replay" aria-labelledby="replay-title" hidden>
    <header class="replay-head"><h2 id="replay-title">对局回放</h2><span id="replay-match" class="mono"></span></header>
    <div class="replay-layout">
      <div class="replay-board">
        <canvas id="replay-canvas" role="img" aria-label="对局基板"></canvas>
        <div class="replay-legend" id="replay-legend"></div>
      </div>
      <div class="replay-info">
        <div class="replay-scores">
          <div class="replay-side">
            <strong>蓝方</strong> <span class="mono" data-team></span>
            <strong class="mono" data-score></strong><p data-state></p><p data-command></p>
          </div>
          <div class="replay-side">
            <strong>红方</strong> <span class="mono" data-team></span>
            <strong class="mono" data-score></strong><p data-state></p><p data-command></p>
          </div>
        </div>
        <div class="replay-result"><span class="mono" id="replay-turn"></span><strong id="replay-result"></strong></div>
        <input class="replay-timeline" id="replay-seek" type="range" min="0" max="0" value="0" aria-label="跳到回合">
        <div class="replay-controls" role="group" aria-label="播放控制">
          <button type="button" id="replay-restart">重新开始</button>
          <button type="button" id="replay-back" aria-label="后退一回合">◀ 1</button>
          <button type="button" id="replay-play" class="primary">播放</button>
          <button type="button" id="replay-next" aria-label="前进一回合">1 ▶</button>
          <button type="button" data-speed="4" aria-pressed="false" aria-label="每秒 4 回合">4 回合/秒</button>
          <button type="button" data-speed="12" aria-pressed="true" aria-label="每秒 12 回合">12</button>
          <button type="button" data-speed="40" aria-pressed="false" aria-label="每秒 40 回合">40</button>
        </div>
        <p class="replay-detail" id="replay-boost"></p>
        <div class="replay-log"><h3>最近事件</h3><ol id="replay-events"></ol></div>
      </div>
    </div>
  </section>
</main>
<script src="./replays/index.js"></script>
<script>
// Adapted from contest/service/replay.js for offline playback.
const replayPlayer = (() => {
  'use strict';
  const view = document.getElementById('match-replay');
  const field = name => document.getElementById('replay-' + name);
  const canvas = field('canvas');
  const slider = field('seek');
  const sideNames = ['蓝方', '红方'];
  const sideCards = [...view.querySelectorAll('.replay-side')];
  const speeds = [...view.querySelectorAll('[data-speed]')];
  const direction = {U: '上', D: '下', L: '左', R: '右'};
  const offsets = {U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0]};
  const reasons = {time: '耗时决胜', lead_turns: '领先回合数决胜',
    crash: '程序退出', errors: '累计错误', startup: '未就绪'};
  const eventText = {
    close: event => '闭合轮廓，新领地面值 ' + event.gain,
    cut: () => '切断对手轮廓',
    selfcut: () => '踩到自身轮廓',
    crash: () => '撞上缺陷或出界',
    collide: () => '束斑相撞',
    down: () => '停机校准',
    respawn: () => '在校准区重启',
    end: () => '对局结束'
  };
  let replay, owner, contour, terrain, boostCells, colors;
  let turn = 0;
  let speed = 12;
  let animation = 0;
  let last = 0;

  function validate(data) {
    if (data?.version !== 'v1' || data.stage !== 'prelim') {
      throw new Error('回放须使用当前赛题规则');
    }
    const {map, init, frames, players, result} = data;
    const size = map?.size;
    const pair = items => Array.isArray(items) && items.length === 2;
    const coordinate = items => pair(items) && items.every(value => Number.isInteger(value) && value >= 0 && value < size);
    const counters = items => pair(items) && items.every(Number.isInteger);
    const grid = (value, pattern) => typeof value === 'string' && value.length === size ** 2 && pattern.test(value);
    const state = record => pair(record?.beams) && record.beams.every(beam =>
      typeof beam?.alive === 'boolean' && Object.hasOwn(direction, beam.dir)) &&
      pair(record.score) && record.score.every(Number.isFinite) &&
      counters(record.lead_turns) && counters(record.time_us);
    if (!Number.isInteger(size) || size < 1 || size > 128 || !Array.isArray(map.terrain) ||
        map.terrain.length !== size || !map.terrain.every(row => typeof row === 'string' && row.length === size && /^[.#*]+$/.test(row)) ||
        (map.calib != null && (!pair(map.calib) || !map.calib.every(pair))) ||
        !pair(players) || !players.every(name => typeof name === 'string') || !state(init) ||
        !grid(init.owner, /^[.01]+$/) || !grid(init.contour, /^[.01]+$/) ||
        !Array.isArray(frames) || result?.turns !== frames.length || ![0, 1, null].includes(result.winner)) {
      throw new Error('回放数据不完整');
    }
    if (!counters(result.lead_turns) || !counters(result.time_us) || !Number.isInteger(data.params?.max_turns)) {
      throw new Error('回放缺少终局计分指标');
    }
    const zones = map.boost_zones;
    const passable = point => coordinate(point) && map.terrain[point[1]][point[0]] !== '#';
    if (!Array.isArray(zones) || zones.length !== 3 || zones.some(zone => !passable(zone?.marker) ||
        !Array.isArray(zone.cells) || !zone.cells.every(passable) ||
        !zone.cells.some(([x, y]) => x === zone.marker[0] && y === zone.marker[1])) ||
        new Set(zones.map(zone => zone.marker.join(','))).size !== zones.length) {
      throw new Error('回放缺少有效的地图加速区');
    }
    if (frames.some((frame, index) => !state(frame) || frame.turn !== index + 1 ||
        !Array.isArray(frame.d) || frame.d.some(delta =>
          !Array.isArray(delta) || !Number.isInteger(delta[0]) || delta[0] < 0 || delta[0] >= size ** 2 ||
          !['.', '0', '1'].includes(delta[1]) || !['.', '0', '1'].includes(delta[2])))) {
      throw new Error('回放帧无效');
    }
    return new Set(zones.flatMap(zone => zone.cells.map(([x, y]) => y * size + x)));
  }

  function resetGrid() {
    owner = [...replay.init.owner];
    contour = [...replay.init.contour];
    turn = 0;
  }

  function seek(target) {
    if (target < turn) resetGrid();
    while (turn < target) {
      for (const [index, nextOwner, nextContour] of replay.frames[turn].d) {
        owner[index] = nextOwner;
        contour[index] = nextContour;
      }
      turn += 1;
    }
    render();
  }

  function blend(color, background, alpha) {
    const channels = hex => {
      const digits = hex.slice(1);
      const value = parseInt(digits.length === 3 ? digits.replace(/./g, '$&$&') : digits, 16);
      return [value >> 16 & 255, value >> 8 & 255, value & 255];
    };
    const base = channels(background);
    return 'rgb(' + channels(color).map((value, index) => Math.round(value * alpha + base[index] * (1 - alpha))).join(',') + ')';
  }

  function palette() {
    const css = getComputedStyle(view);
    const read = name => css.getPropertyValue('--' + name).trim();
    const surface = read('surface');
    const sides = [read('blue'), read('red')];
    return {surface, sides, exposed: sides.map(color => blend(color, surface, .72)),
      cell: read('replay-cell'), defect: read('replay-defect'), key: read('replay-key'),
      boost: read('replay-boost')};
  }

  function drawBoard(state) {
    const width = Math.round(canvas.clientWidth * (window.devicePixelRatio || 1));
    if (!width) return;
    if (canvas.width !== width || canvas.height !== width) canvas.width = canvas.height = width;
    const context = canvas.getContext('2d');
    const size = replay.map.size;
    const cell = width / size;
    const gap = cell * .07;
    const fill = (color, x, y, length) => {
      context.fillStyle = color;
      context.fillRect(x, y, length, length);
    };
    fill(colors.surface, 0, 0, width);
    for (let index = 0; index < terrain.length; index += 1) {
      const x = (index % size) * cell + gap / 2;
      const y = Math.floor(index / size) * cell + gap / 2;
      const length = cell - gap;
      const tile = terrain[index];
      const seat = owner[index];
      if (tile === '#') {
        fill(colors.defect, x, y, length);
        continue;
      }
      fill(seat === '.' ? colors.cell : colors.exposed[seat], x, y, length);
      if (boostCells.has(index)) {
        context.strokeStyle = colors.boost;
        context.lineWidth = Math.max(1, cell * .14);
        context.strokeRect(x + cell * .1, y + cell * .1, length - cell * .2, length - cell * .2);
      }
      if (tile === '*') fill(colors.key, x + length * .3, y + length * .3, length * .4);
      const trail = contour[index];
      if (trail !== '.') fill(colors.sides[trail], x + length * .23, y + length * .23, length * .54);
    }
    context.lineWidth = Math.max(1.5, cell * .12);
    (replay.map.calib ?? []).forEach(([x, y], seat) => {
      context.strokeStyle = colors.sides[seat];
      context.strokeRect((x - 1) * cell + 1, (y - 1) * cell + 1, 3 * cell - 2, 3 * cell - 2);
    });
    const [blue, red] = state.beams;
    const sharedCell = blue.alive && red.alive && blue.x === red.x && blue.y === red.y;
    state.beams.forEach((beam, seat) => {
      if (!beam.alive) return;
      const inset = cell * .08;
      const height = cell - 2 * inset;
      const width = sharedCell ? height / 2 : height;
      const x = beam.x * cell + inset + (sharedCell ? seat * width : 0);
      const y = beam.y * cell + inset;
      const [dx, dy] = offsets[beam.dir];
      context.fillStyle = colors.sides[seat];
      context.fillRect(x, y, width, height);
      context.strokeStyle = colors.surface;
      context.strokeRect(x, y, width, height);
      context.fillStyle = colors.surface;
      context.beginPath();
      context.arc(x + width * (.5 + .22 * dx), y + height * (.5 + .22 * dy),
        sharedCell ? cell * .08 : cell * .12, 0, 2 * Math.PI);
      context.fill();
    });
  }

  function renderLegend() {
    const items = [['蓝方图形区', colors.exposed[0]], ['红方图形区', colors.exposed[1]],
      ['基板缺陷', colors.defect], ['关键图形区', colors.key], ['加速区', colors.boost]];
    field('legend').replaceChildren(...items.map(([label, color]) => {
      const marker = document.createElement('i');
      marker.style.backgroundColor = color;
      const item = document.createElement('span');
      item.append(marker, label);
      return item;
    }));
  }

  function renderEvents() {
    const rows = [];
    for (let frame = turn; frame > 0 && rows.length < 12; frame -= 1) {
      const events = replay.frames[frame - 1].events;
      if (!Array.isArray(events)) continue;
      for (let index = events.length - 1; index >= 0 && rows.length < 12; index -= 1) {
        const event = events[index];
        if (typeof event?.t !== 'string' || !Object.hasOwn(eventText, event.t)) continue;
        const row = document.createElement('li');
        const number = document.createElement('code');
        number.textContent = '#' + frame;
        const side = event.t === 'end' ? '' : sideNames[event.s];
        row.append(number, (side ? side + ' ' : '') + eventText[event.t](event));
        rows.push(row);
      }
    }
    if (!rows.length) {
      const empty = document.createElement('li');
      empty.textContent = '暂无事件';
      rows.push(empty);
    }
    field('events').replaceChildren(...rows);
  }

  function syncPlayback() {
    if (!replay) return;
    const total = replay.frames.length;
    field('play').textContent = animation ? '暂停' : total > 0 && turn === total ? '重播' : '播放';
    field('play').disabled = field('restart').disabled = slider.disabled = total === 0;
    field('back').disabled = turn === 0;
    field('next').disabled = turn === total;
    slider.value = turn;
  }

  function render() {
    const state = replay.frames[turn - 1] ?? replay.init;
    drawBoard(state);
    sideCards.forEach((card, seat) => {
      const beam = state.beams[seat];
      const status = beam.alive ? '（' + beam.x + ', ' + beam.y + '）向' + direction[beam.dir] :
        '停机校准 · ' + beam.restart_in + ' 回合';
      card.querySelector('[data-score]').textContent = state.score[seat];
      const totals = turn === replay.frames.length ? replay.result : state;
      const details = ' · 领先 ' + totals.lead_turns[seat] + ' 回合 · 累计 ' + totals.time_us[seat] + ' 微秒';
      card.querySelector('[data-state]').textContent = status + details;
      const command = state.cmds?.[seat];
      const move = typeof command === 'string' && direction[command[0]];
      const elapsed = state.ms?.[seat];
      const summary = move ? '指令 ' + move : turn ? '指令 —' : '初始局面';
      card.querySelector('[data-command]').textContent = summary + (Number.isFinite(elapsed) ? ' · ' + elapsed + ' ms' : '');
    });
    field('turn').textContent = '第 ' + turn + ' / ' + replay.frames.length + ' 回合';
    const {winner, reason} = replay.result;
    const result = winner !== null ? sideNames[winner] + '获胜' : reason === 'double_loss' ? '双方判负' : '待裁定';
    field('result').textContent = turn === replay.frames.length ? result + (reasons[reason] ? ' · ' + reasons[reason] : '') : '';
    renderEvents();
    syncPlayback();
  }

  function pause() {
    cancelAnimationFrame(animation);
    animation = 0;
    syncPlayback();
  }

  function tick(now) {
    if (now - last >= 1000 / speed) {
      last = now;
      seek(turn + 1);
    }
    if (turn < replay.frames.length) animation = requestAnimationFrame(tick);
    else pause();
  }

  function play() {
    if (!replay?.frames.length || animation) return;
    if (turn === replay.frames.length) seek(0);
    last = performance.now();
    animation = requestAnimationFrame(tick);
    syncPlayback();
  }

  field('play').addEventListener('click', () => animation ? pause() : play());
  field('restart').addEventListener('click', () => { pause(); seek(0); play(); });
  field('back').addEventListener('click', () => { pause(); seek(turn - 1); });
  field('next').addEventListener('click', () => { pause(); seek(turn + 1); });
  slider.addEventListener('input', () => {
    const target = Number(slider.value);
    pause();
    seek(target);
  });
  for (const button of speeds) button.addEventListener('click', () => {
    speed = Number(button.dataset.speed);
    for (const choice of speeds) choice.setAttribute('aria-pressed', String(choice === button));
  });
  window.addEventListener('resize', () => { if (replay) drawBoard(replay.frames[turn - 1] ?? replay.init); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!replay) return;
    colors = palette();
    renderLegend();
    render();
  });

  return {
    load(data, label) {
      const cells = validate(data);
      pause();
      replay = data;
      terrain = replay.map.terrain.join('');
      boostCells = cells;
      field('boost').textContent = '加速区整局可用 · 共 ' + cells.size + ' 格';
      resetGrid();
      field('match').textContent = label + ' · ' + (replay.map.id || '基板') + ' · ' + '初赛';
      sideCards.forEach((card, seat) => { card.querySelector('[data-team]').textContent = replay.players[seat]; });
      slider.max = replay.frames.length;
      view.hidden = false;
      colors = palette();
      renderLegend();
      render();
    },
    clear() {
      pause();
      replay = undefined;
      view.hidden = true;
    }
  };
})();
</script>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const list = byId('replay-list');
  const status = byId('file-status');
  let files = [];
  let request = 0;

  function showStatus(message, error = false) {
    status.textContent = message;
    status.toggleAttribute('data-error', error);
  }

  async function loadSelected() {
    const reading = ++request;
    const file = files[list.selectedIndex];
    replayPlayer.clear();
    if (!file) return;
    showStatus('正在读取回放…');
    try {
      const data = JSON.parse(await file.text());
      if (reading !== request) return;
      replayPlayer.load(data, file.name);
      showStatus('');
    } catch (error) {
      if (reading !== request) return;
      replayPlayer.clear();
      showStatus(error instanceof SyntaxError ? '文件不是有效的 JSON。' : '无法打开回放。' + error.message, true);
    }
  }

  function showFiles(available, emptyMessage) {
    files = available;
    list.replaceChildren();
    for (const file of files) {
      const option = new Option(file.name);
      option.title = file.webkitRelativePath || file.name;
      list.add(option);
    }
    list.disabled = files.length === 0;
    if (files.length) {
      list.selectedIndex = 0;
      loadSelected();
    } else {
      ++request;
      replayPlayer.clear();
      list.add(new Option('没有回放文件'));
      showStatus(emptyMessage);
    }
  }

  function openFiles(input) {
    const selected = Array.from(input.files).filter(file => /\.json$/i.test(file.name))
      .sort((a, b) => b.lastModified - a.lastModified || a.name.localeCompare(b.name));
    input.value = '';
    showFiles(selected, '所选位置没有 JSON 文件。');
  }

  function unpackReplay(encoded) {
    const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  for (const [button, field] of [['choose-folder', 'folder-input'], ['choose-files', 'files-input']]) {
    const input = byId(field);
    byId(button).addEventListener('click', () => input.click());
    input.addEventListener('change', () => openFiles(input));
  }
  list.addEventListener('change', loadSelected);

  const indexedFiles = (globalThis.playerKitReplayIndex ?? []).map(([name, encoded]) => ({
    name, webkitRelativePath: 'replays/' + name, text: () => unpackReplay(encoded)
  }));
  showFiles(indexedFiles, '暂无可自动加载的回放，请选择回放文件夹或打开 JSON。');
})();
</script>
</body>
</html>
