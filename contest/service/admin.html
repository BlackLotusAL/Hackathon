<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赛事管理 · Contest</title>
  <style>
    :root { font-family: Inter, system-ui, "Microsoft YaHei", sans-serif; color: #172540; background: #f4f6fb; }
    body { margin: 0; }
    main { max-width: 70rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0; }
    h2 { font-size: 1.08rem; margin: 0 0 1rem; }
    section { background: #fff; border: 1px solid #dce4f1; border-radius: .75rem; padding: 1.2rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
    .actions, form { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; }
    form { margin: 0; }
    input, select, button, a[download] { font: inherit; }
    input[type=file] { max-width: 100%; }
    button, a[download] { display: inline-block; padding: .55rem .85rem; border: 1px solid #bac8e0;
      border-radius: .45rem; background: #fff; color: #1d3c75; text-decoration: none; cursor: pointer; }
    #plan, a[download] { background: #214fba; border-color: #214fba; color: #fff; }
    button:disabled, a[aria-disabled=true] { color: #576782; background: #eef2f8; border-color: #dce4f1; cursor: default; }
    a[aria-disabled=true] { pointer-events: none; }
    :focus-visible { outline: 2px solid #214fba; outline-offset: 3px; }
    .muted, #state { color: #4b5d7b; }
    .message { min-height: 1.3em; margin: .75rem 0 0; }
    .message[data-error] { color: #9c2933; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: .55rem 1rem; margin: 0; }
    dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; }
    .scroll { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: .5rem .65rem; border-bottom: 1px solid #e5ebf5; }
    summary { cursor: pointer; font-weight: 650; margin: .25rem 0; }
    .withdraw { padding-top: .9rem; margin-top: .9rem; border-top: 1px solid #e5ebf5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header><h1>初赛单循环</h1><span id="state" role="status">正在读取进度</span></header>
  <section aria-labelledby="manage-title">
    <h2 id="manage-title">名单与赛果</h2>
    <div class="actions">
      <form id="import-form">
        <label for="file">队伍名单 XLSX</label>
        <input id="file" type="file" accept=".xlsx" required>
        <button id="import" type="submit" disabled>导入名单</button>
      </form>
      <button id="plan" type="button" disabled>创建单循环</button>
      <button id="confirm" type="button" disabled>确认赛果</button>
      <a id="export" download="初赛结果.xlsx" aria-disabled="true">下载初赛结果</a>
    </div>
    <p id="message" class="message" role="status"></p>
    <details>
      <summary id="roster-title">队伍名单</summary>
      <div class="scroll"><table><thead><tr><th>队伍编号</th><th>队名</th></tr></thead><tbody id="roster"></tbody></table></div>
    </details>
    <form class="withdraw" id="withdraw-form" hidden>
      <label for="withdraw-team">退赛队伍</label>
      <select id="withdraw-team" required></select>
      <button id="withdraw" type="submit">登记退赛</button>
      <span class="muted">未下达 Arena 的场次按整场判负处理。</span>
    </form>
  </section>
  <div class="grid">
    <section aria-labelledby="duels-title"><h2 id="duels-title">对决进度</h2><dl id="duels"></dl></section>
    <section aria-labelledby="games-title"><h2 id="games-title">预定局进度</h2><dl id="games"></dl></section>
  </div>
  <section id="attention-section" aria-labelledby="attention-title" hidden>
    <h2 id="attention-title">待处理记录</h2>
    <div class="scroll"><table><thead><tr><th>对决编号</th><th>预定局序</th><th>执行编号</th><th>原因</th><th>操作</th></tr></thead><tbody id="attention"></tbody></table></div>
  </section>
  <section id="ranking-section" aria-labelledby="ranking-title" hidden>
    <h2 id="ranking-title">初赛排名</h2>
    <p id="ranking-status" class="muted" hidden></p>
    <div class="scroll"><table><thead><tr><th>名次</th><th>队伍编号</th><th>胜局数</th><th>负局数</th></tr></thead><tbody id="ranking"></tbody></table></div>
  </section>
  <section aria-labelledby="ruling-title">
    <h2 id="ruling-title">人工裁定</h2>
    <form id="ruling-form" hidden>
      <label for="ruling-target">待裁定场次</label>
      <select id="ruling-target" required></select>
      <label for="ruling-winner">胜方</label>
      <select id="ruling-winner" required></select>
      <label for="ruling-reason">裁定理由</label>
      <input id="ruling-reason" type="text" required>
      <button id="ruling-submit" type="submit">记录裁定</button>
    </form>
    <p id="ruling-detail" class="muted">正在读取待裁定场次</p>
    <p id="ruling-message" class="message" role="status"></p>
  </section>
  <section aria-labelledby="load-title">
    <h2 id="load-title">独立压测</h2>
    <form id="load-form">
      <label for="load-id">批次编号</label>
      <input id="load-id" type="text" pattern="load-[A-Za-z0-9_\-]{1,40}" placeholder="load-trial-1" required>
      <label for="load-file">压测名单 XLSX</label>
      <input id="load-file" type="file" accept=".xlsx" required>
      <button id="load-start" type="submit">启动压测</button>
    </form>
    <p id="load-message" class="message" role="status"></p>
    <div id="load-details" hidden>
      <p class="actions">
        <label for="load-batch">查看批次</label> <select id="load-batch"></select>
        <button type="button" id="load-stop" disabled>结束压测</button>
      </p>
      <dl id="load-progress"></dl>
      <div id="load-attention-section" class="scroll" hidden>
        <table><thead><tr><th>对决编号</th><th>预定局序</th><th>执行编号</th><th>原因</th><th>操作</th></tr></thead><tbody id="load-attention"></tbody></table>
      </div>
    </div>
  </section>
  <section aria-labelledby="arena-title">
    <h2 id="arena-title">Arena 槽位与队列</h2>
    <p id="arena-time" class="muted">正在读取 Arena 状态</p>
    <dl id="arena"></dl>
  </section>
</main>
<script>
  'use strict';
  const node = id => document.getElementById(id);
  const base = '/admin/prelim';
  const loadTests = '/admin/load-tests';
  const rulings = '/admin/rulings';
  const jsonType = 'application/json';
  const workbookType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const stateLabel = {
    empty: '等待导入名单', roster_imported: '名单已导入', running: '单循环执行中',
    awaiting_confirmation: '等待确认赛果', confirmed: '赛果已确认', finished: '压测完成', stopped: '压测已结束'
  };
  let changing = false;
  let version = 0;
  let lastProgress;
  let rankingRequested = false;
  let pendingRulings = [];
  let selectedLoad = '';

  function pairs(id, values) {
    node(id).replaceChildren(...values.flatMap(([label, value]) => {
      const term = document.createElement('dt');
      const detail = document.createElement('dd');
      term.textContent = label;
      detail.textContent = value;
      return [term, detail];
    }));
  }

  function rows(id, data) {
    node(id).replaceChildren(...data.map(record => {
      const row = document.createElement('tr');
      for (const value of record) {
        const cell = row.insertCell();
        if (value instanceof Node) cell.append(value);
        else cell.textContent = value ?? '';
      }
      return row;
    }));
  }

  function retryButton(item, path, messageId) {
    if (!item.retryable) return '';
    const button = document.createElement('button');
    button.type = 'button';
    button.disabled = changing;
    button.textContent = '重跑';
    button.setAttribute('aria-label', `重跑 ${item.run_id}`);
    button.addEventListener('click', () => change(
      path, '已提交重跑', JSON.stringify({run_id: item.run_id}), jsonType, {messageId}
    ));
    return button;
  }

  function renderAttention(prefix, attention, path, messageId) {
    node(`${prefix}attention-section`).hidden = attention.length === 0;
    rows(`${prefix}attention`, attention.map(item => [
      item.duel_id, item.ordinal, item.run_id, item.issue, retryButton(item, path, messageId)
    ]));
  }

  function duelStats(duels) {
    return [
      ['已结算场次', `${duels.settled} / ${duels.total}`], ['待处理场次', duels.awaiting_action],
      ['其余未结算', duels.pending]
    ];
  }

  function gameStats(games, attempts) {
    return [
      ['有效局数', `${games.effective} / ${games.total}`], ['裁定免打', games.waived],
      ['待提交', games.pending], ['等待 Arena 结果', games.waiting_result], ['待复核', games.waiting_review],
      ['待人工处理', games.awaiting_action], ['交付未确认', games.unconfirmed],
      ['已登记重跑尝试', attempts.retries], ['累计作废尝试', attempts.voided]
    ];
  }

  function render(data) {
    lastProgress = data;
    node('state').textContent = stateLabel[data.state];
    const {duels, games, attempts, teams, attention} = data;
    pairs('duels', duelStats(duels));
    pairs('games', gameStats(games, attempts));
    node('roster-title').textContent = `队伍名单（${teams.length}）`;
    rows('roster', teams.map(team => [team.team_id, team.name]));
    renderAttention('', attention, `${base}/retry`, 'message');
    const canImport = ['empty', 'roster_imported'].includes(data.state);
    node('file').disabled = changing || !canImport;
    node('import').disabled = changing || !canImport;
    node('plan').disabled = changing || data.state !== 'roster_imported';
    node('confirm').disabled = changing || data.state !== 'awaiting_confirmation';
    const download = node('export');
    const confirmed = data.state === 'confirmed';
    download.setAttribute('aria-disabled', String(!confirmed));
    if (confirmed) download.href = `${base}/results.xlsx`;
    else download.removeAttribute('href');
    const rankingReady = confirmed || data.state === 'awaiting_confirmation';
    node('ranking-section').hidden = !rankingReady;
    if (rankingReady && !rankingRequested) refreshRanking();

    const select = node('withdraw-team');
    const available = teams.filter(team => !team.withdrawn);
    node('withdraw-form').hidden = data.state !== 'running' || available.length === 0;
    if (!node('withdraw-form').hidden) {
      const selected = select.value;
      select.replaceChildren(new Option('请选择队伍', ''), ...available.map(team =>
        new Option([team.team_id, team.name].filter(Boolean).join(' '), team.team_id)));
      if (available.some(team => team.team_id === selected)) select.value = selected;
      select.disabled = node('withdraw').disabled = changing;
    }
  }

  function rulingSelection() {
    return pendingRulings.find(item => (item.run_id || item.duel_id) === node('ruling-target').value);
  }

  function renderRulingSelection() {
    const item = rulingSelection();
    const winner = node('ruling-winner');
    const previous = winner.value;
    winner.replaceChildren(new Option('请选择胜方', ''), ...(item ? item.sides.map(side => new Option(side, side)) : []));
    if (item && item.sides.includes(previous)) winner.value = previous;
    node('ruling-detail').textContent = item ? `${item.issue} · ${item.sides.join(' 对 ')}` :
      pendingRulings.length ? '请选择一个待裁定场次' : '当前没有待裁定场次';
    node('ruling-submit').disabled = changing || !item;
    winner.disabled = !item;
  }

  function renderRulings(data) {
    pendingRulings = data.pending;
    const select = node('ruling-target');
    const previous = select.value;
    select.replaceChildren(new Option('请选择场次', ''), ...pendingRulings.map(item => {
      const target = item.run_id || item.duel_id;
      const title = item.run_id ? `${target} · 第 ${item.ordinal} 局` : `${target} · 整场`;
      return new Option(item.batch_id ? `${title} · ${item.batch_id === 'official' ? '正式初赛' : item.batch_id}` : title, target);
    }));
    if (pendingRulings.some(item => (item.run_id || item.duel_id) === previous)) select.value = previous;
    else if (previous) node('ruling-reason').value = '';
    node('ruling-form').hidden = pendingRulings.length === 0;
    renderRulingSelection();
  }

  async function renderLoadTests(data, current) {
    const selectable = data.batches.map(batch => batch.batch_id);
    if (!selectable.includes(selectedLoad)) selectedLoad = selectable[0] || '';
    node('load-batch').replaceChildren(...selectable.map(batch => new Option(batch, batch)));
    node('load-batch').value = selectedLoad;
    node('load-details').hidden = !selectedLoad;
    node('load-stop').disabled = true;
    if (selectedLoad) await refreshSection(`${loadTests}/${selectedLoad}`, renderLoadTest, 'load-message', current);
  }

  function renderLoadTest(data) {
    pairs('load-progress', [
      ['批次状态', stateLabel[data.state]], ['编排时间', data.planned_at],
      ['结束时间', data.finished_at || data.stopped_at || '进行中'],
      ['已用秒数', data.elapsed_seconds], ['每分钟结算场次', data.duels_per_minute],
      ['取消场次', data.duels.cancelled], ['取消预定局', data.games.cancelled],
      ...duelStats(data.duels), ...gameStats(data.games, data.attempts)
    ]);
    node('load-stop').disabled = changing || data.state !== 'running';
    renderAttention('load-', data.attention, `${loadTests}/${data.batch_id}/retry`, 'load-message');
  }

  async function request(path, options) {
    const response = await fetch(path, {cache: 'no-store', ...options});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || `请求失败（${response.status}）`);
    return data;
  }

  function message(id, text, error = false) {
    node(id).textContent = text;
    node(id).toggleAttribute('data-error', error);
  }

  async function refreshSection(path, renderSection, messageId, current) {
    try {
      const data = await request(path);
      if (current === version) await renderSection(data, current);
    } catch (error) {
      if (current === version) message(messageId, error.message, true);
    }
  }

  async function refresh() {
    if (changing) return;
    const current = ++version;
    await Promise.all([
      refreshSection(`${base}/progress`, render, 'message', current),
      refreshSection(rulings, renderRulings, 'ruling-message', current),
      refreshSection(loadTests, renderLoadTests, 'load-message', current)
    ]);
  }

  async function refreshArena() {
    try {
      const data = await request('/admin/arena/status');
      node('arena-time').textContent = data.at;
      pairs('arena', [
        ['空闲槽位', data.slots.idle], ['使用中槽位', data.slots.busy], ['停用槽位', data.slots.disabled],
        ['排队执行', data.queue], ['近 10 分钟完成执行', data.done_10m], ['近 1 小时平台故障', data.platform_errors_1h]
      ]);
    } catch (error) {
      node('arena-time').textContent = 'Arena 状态暂不可用';
      node('arena').replaceChildren();
    }
  }

  async function refreshRanking() {
    rankingRequested = true;
    try {
      const data = await request(`${base}/standings`);
      rows('ranking', data.rows);
      node('ranking-status').hidden = true;
    } catch (error) {
      node('ranking-status').textContent = error.message;
      node('ranking-status').hidden = false;
      rankingRequested = false;
    }
  }

  async function change(path, done, body, contentType, {messageId = 'message', onSuccess} = {}) {
    if (changing) return;
    changing = true;
    ++version;
    if (lastProgress) render(lastProgress);
    for (const id of ['load-start', 'load-stop', 'ruling-submit']) node(id).disabled = true;
    const headers = {'X-Contest-Admin': '1'};
    if (contentType) headers['Content-Type'] = contentType;
    try {
      const data = await request(path, {method: 'POST', headers, body});
      if (onSuccess) onSuccess(data);
      message(messageId, done);
    } catch (error) {
      message(messageId, error.message, true);
    } finally {
      changing = false;
      node('load-start').disabled = false;
      await refresh();
    }
  }

  node('import-form').addEventListener('submit', event => {
    event.preventDefault();
    const file = node('file').files[0];
    if (file) change(`${base}/roster`, '名单已导入', file, workbookType);
  });
  node('plan').addEventListener('click', () => change(`${base}/plan`, '已创建单循环'));
  node('confirm').addEventListener('click', () => change(`${base}/confirm`, '已确认初赛赛果'));
  node('withdraw-form').addEventListener('submit', event => {
    event.preventDefault();
    change(`${base}/withdraw`, '已登记退赛', JSON.stringify({teams: [node('withdraw-team').value]}), jsonType);
  });
  node('ruling-target').addEventListener('change', () => {
    node('ruling-winner').value = node('ruling-reason').value = '';
    renderRulingSelection();
  });
  node('ruling-form').addEventListener('submit', event => {
    event.preventDefault();
    const item = rulingSelection();
    if (!item) return;
    const body = {scope: item.scope, target: item.run_id || item.duel_id,
      winner: node('ruling-winner').value, reason: node('ruling-reason').value};
    change(rulings, '已记录裁定', JSON.stringify(body), jsonType, {
      messageId: 'ruling-message', onSuccess: () => { node('ruling-reason').value = ''; }
    });
  });
  node('load-form').addEventListener('submit', event => {
    event.preventDefault();
    const file = node('load-file').files[0];
    const batch = encodeURIComponent(node('load-id').value);
    if (file) change(`${loadTests}/${batch}`, '压测批次已创建', file, workbookType, {
      messageId: 'load-message', onSuccess: data => { selectedLoad = data.batch_id; }
    });
  });
  node('load-batch').addEventListener('change', event => {
    selectedLoad = event.target.value;
    refresh();
  });
  node('load-stop').addEventListener('click', () => {
    change(`${loadTests}/${selectedLoad}/stop`, '压测批次已结束', undefined, undefined, {messageId: 'load-message'});
  });
  refresh();
  refreshArena();
  setInterval(refresh, 5000);
  setInterval(refreshArena, 15000);
</script>
</body>
</html>
